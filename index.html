
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Wisata Kulon Progo</title>

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>WebGIS Rekomendasi Destinasi dan Rute Wisata</h1>
        <p>Kapanewon Girimulyo, Kalibawang, dan Samigaluh</p>
        <button id="btnUbahPreferensi">Ubah Preferensi</button>
    </header>

    <main>
        <div id="map"></div>
    </main>

    <section id="panduan" class="panduan">
        <div class="panduan-card">
            <h2>Temukan Destinasi Wisata Pilihanmu</h2>
            <p>Jawab 5 pertanyaan berikut untuk mendapatkan rekomendasi wisata.</p>

            <div id="progress">
                Pertanyaan 1 dari 5
            </div>

            <div id="isiPertanyaan">
                <!-- Pertanyaan akan ditampilkan melalui JavaScript -->
            </div>

            <div class="panduan-footer">
                <button id="btnKembali" disabled>Kembali</button>
                <button id="btnLanjut">Lanjut</button>
            </div>
        </div>
    </section>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="data/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
